# Runtime settings for the aggregator pipeline.

app:
  name: v2agg
  # Public Pages origin (subscription links for Telegram description / index)
  pages_base_url: "https://alirezaprogrammermaker.github.io"
  # Short intro line for the Telegram channel description (links + Shamsi time appended in code)
  channel_description: "کانفیگ‌های فعال V2Ray/Xray · تست خودکار"

pipeline:
  # Max wall time budget before writing checkpoint and exiting cleanly (seconds).
  # GitHub Actions public runners ~6h; leave headroom for publish + Telegram.
  max_runtime_sec: 19800  # 5h 30m
  checkpoint_interval_sec: 120
  # More sources → test a larger slice per run (remainder resumes next cron)
  max_configs_to_test_per_run: 1800
  # Always re-test previously published healthy servers first each run
  retest_healthy_first: true
  max_healthy_publish: 300
  max_telegram_post_per_run: 20
  best_score_threshold: 40
  # Drop from public list if not reconfirmed alive within this window
  healthy_max_age_hours: 4

fetch:
  user_agent: "v2agg/1.0 (+https://github.com/alirezaprogrammermaker/alirezaprogrammermaker.github.io)"
  retries: 3
  backoff_base_sec: 1.5
  backoff_max_sec: 20
  connect_timeout_sec: 15
  read_timeout_sec: 45

validation:
  allowed_schemes:
    - vmess
    - vless
    - trojan
    - ss
    - ssr
    - hysteria2
    - hy2
    - hysteria
    - tuic
    - wireguard
    - wg
    - socks
    - socks5
    - http
    - https
    - juicity
    - anytls
    - brook
    - naive
    - mieru
  # Faster eviction of repeatedly dead nodes
  max_fail_count: 2
  max_age_hours: 24
  min_port: 1
  max_port: 65535

testing:
  # Prefer real proxy probe via Xray when binary is available.
  mode: auto  # auto | xray | tcp
  probe_url: https://www.cloudflare.com/cdn-cgi/trace
  tcp_timeout_sec: 4
  tls_timeout_sec: 7
  xray_timeout_sec: 18
  concurrency: 24
  # Latency scoring (ms)
  score_latency_excellent_ms: 400
  score_latency_good_ms: 1200
  score_latency_ok_ms: 3000
  # Local SOCKS base port for xray probes (each worker + offset)
  local_socks_base_port: 21000
  xray_bin: bin/xray
  xray_workdir: state/runtime/xray

publish:
  # GitHub Pages paths (committed under repo root for Pages serving)
  output_dir: subs
  all_file: all.txt
  all_base64_file: all.base64
  best_file: best.txt
  best_base64_file: best.base64
  by_protocol_dir: by-protocol
  # Strip remarks that look like source attribution
  sanitize_remarks: true
  # Remarks become ⚡{ping}ms-{n} so clients show lowest ping first visually too
  remark_prefix: "⚡"
  sort_by: latency

telegram:
  # Secrets come from env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
  # Channel username (not the bot username). Resolves via getChat if ID not numeric.
  channel_username: "@v2ray_active_config"
  rate_limit_per_minute: 12
  post_best: true
  update_description: true
  dry_run: false
  # Telegram channel description hard limit is 255 chars — keep intro short; code appends Shamsi + URLs
  message_template: |
    ✅ کانفیگ فعال
    پروتکل: {protocol}
    پینگ: {latency_ms} ms
    امتیاز: {score}

    `{link}`

state:
  dir: state
  checkpoint_file: checkpoint.json
  metrics_file: metrics.json
  healthy_db_file: healthy.json

logging:
  level: INFO
  json: false
