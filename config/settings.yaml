# Runtime settings for the aggregator pipeline.

app:
  name: v2agg
  # Public Pages origin (subscription links for Telegram description / index)
  pages_base_url: "https://alirezaprogrammermaker.github.io"
  # Short intro line for the Telegram channel description (links + Shamsi time appended in code)
  channel_description: "کانفیگ‌های فعال V2Ray/Xray · تست خودکار"

pipeline:
  # Stay alive for nearly the full public Actions budget (~6h), then cron starts the next job.
  continuous: true
  max_runtime_sec: 19800  # 5h 30m (leave headroom before hard 6h kill)
  # Parallel watchdog: re-probe EVERY healthy server this often and drop dead ones immediately
  health_watch_interval_sec: 120
  discovery_cycle_pause_sec: 10
  # Push subs/ to GitHub Pages whenever the live list changes (during the long run)
  git_publish: true
  checkpoint_interval_sec: 120
  # Candidates tested per discovery cycle (watchdog runs in parallel)
  max_configs_to_test_per_run: 1200
  retest_healthy_first: true
  max_healthy_publish: 300
  max_telegram_post_per_run: 15
  best_score_threshold: 40
  # Drop if not reconfirmed (~15 min — real Xray probes are slower than TCP-open fakes)
  healthy_max_age_hours: 0.25

fetch:
  user_agent: "v2agg/1.0 (+https://github.com/alirezaprogrammermaker/alirezaprogrammermaker.github.io)"
  retries: 3
  backoff_base_sec: 1.5
  backoff_max_sec: 20
  connect_timeout_sec: 15
  read_timeout_sec: 45
  concurrency: 10

validation:
  allowed_schemes:
    - vmess
    - vless
    - trojan
    - ss
    - ssr
    - hysteria2
    - hy2
    - hysteria
    - tuic
    - wireguard
    - wg
    - socks
    - socks5
    - http
    - https
    - juicity
    - anytls
    - brook
    - naive
    - mieru
  # Faster eviction of repeatedly dead nodes
  max_fail_count: 2
  max_age_hours: 24
  min_port: 1
  max_port: 65535

testing:
  # Prefer real proxy probe via Xray when binary is available.
  mode: auto  # auto | xray | tcp
  probe_url: https://www.cloudflare.com/cdn-cgi/trace
  tcp_timeout_sec: 4
  tls_timeout_sec: 7
  xray_timeout_sec: 18
  # Never treat "TCP port open" as a working proxy when Xray can probe (avoids garbage hy2/etc.)
  accept_tcp_only: false
  concurrency: 24
  watch_concurrency: 16
  # Latency scoring (ms)
  score_latency_excellent_ms: 400
  score_latency_good_ms: 1200
  score_latency_ok_ms: 3000
  # Local SOCKS base port for xray probes (each worker + offset)
  local_socks_base_port: 21000
  # Parallel health-watch uses a separate port range / workdir
  watch_socks_base_port: 26000
  watch_xray_workdir: state/runtime/xray-watch
  xray_bin: bin/xray
  xray_workdir: state/runtime/xray

publish:
  # GitHub Pages paths (committed under repo root for Pages serving)
  output_dir: subs
  all_file: all.txt
  all_base64_file: all.base64
  best_file: best.txt
  best_base64_file: best.base64
  by_protocol_dir: by-protocol
  # Strip remarks that look like source attribution
  sanitize_remarks: true
  # Remarks: ⚡{ping}ms·{بازی|وب|دانلود}-{n} from real probe metrics only
  remark_prefix: "⚡"
  sort_by: latency
  usecase:
    # Real thresholds from measured latency / throughput — never random labels
    game_max_ms: 150      # بازی — low ping for interactive use
    web_max_ms: 500       # وب — fine for browsing
    download_min_kbps: 400  # دانلود — solid pipe (or higher ping bulk use)

telegram:
  # Secrets come from env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
  # Channel username (not the bot username). Resolves via getChat if ID not numeric.
  channel_username: "@v2ray_active_config"
  rate_limit_per_minute: 12
  post_best: true
  update_description: true
  dry_run: false
  # Telegram channel description hard limit is 255 chars — keep intro short; code appends Shamsi + URLs
  message_template: |
    ✅ کانفیگ فعال
    کاربرد: {usecase}
    پروتکل: {protocol}
    پینگ: {latency_ms} ms
    امتیاز: {score}

    `{link}`

state:
  dir: state
  checkpoint_file: checkpoint.json
  metrics_file: metrics.json
  healthy_db_file: healthy.json

logging:
  level: INFO
  json: false
