name: Refresh subscriptions

# Continuous ~6h live job + cron handoff
# ------------------------------------
# Public GitHub-hosted runners allow ~6 hours per job. The aggregator runs in
# continuous mode for ~5h30m:
#   • discovery loop: fetch sources → live-test → merge healthy → publish
#   • parallel health-watch (every 2 min): re-probe ALL healthy servers, drop dead,
#     republish + git-push so Pages always mirrors a fresh list
# Cron every 5h queues the next job (concurrency waits), so coverage stays near-continuous.
# Ephemeral state restored via cache + artifact; `subs/` is committed for Pages.

on:
  schedule:
    # Every 5 hours — overlaps the 5h30m runtime so the next run is ready to start
    - cron: "17 */5 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: false
        default: refresh
        type: choice
        options:
          - refresh
          - publish-only
      telegram_dry_run:
        description: "Dry-run Telegram (no API calls)"
        required: false
        default: false
        type: boolean

concurrency:
  group: v2agg-refresh
  # Let the in-flight 6h job finish; queued cron starts immediately after
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Xray-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          bash scripts/install-xray.sh
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: v2agg-state-${{ github.run_id }}
          restore-keys: |
            v2agg-state-

      - name: Restore previous checkpoint artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: v2agg-checkpoint
          workflow: refresh.yml
          workflow_conclusion: completed
          path: state
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run continuous aggregator (~5h30m + 2-min health watch)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_DRY_RUN: ${{ github.event.inputs.telegram_dry_run == 'true' && 'true' || 'false' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'refresh' }}"
          EXTRA=()
          if [[ "${TELEGRAM_DRY_RUN}" == "true" ]]; then
            EXTRA+=(--telegram-dry-run)
          fi
          export PATH="${GITHUB_WORKSPACE}/bin:${PATH}"
          python -m v2agg --mode "${MODE}" --print-metrics "${EXTRA[@]}"

      - name: Upload checkpoint / state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2agg-checkpoint
          path: |
            state/checkpoint.json
            state/healthy.json
            state/metrics.json
            state/daily.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: v2agg-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Final commit & push subscription files
        if: always()
        run: bash scripts/publish-subs.sh
