name: Refresh subscriptions

# Frequent refresh with resumable checkpoints.
#
# ## 6-hour resume model
# Public GitHub-hosted runners allow ~6 hours per job. `pipeline.max_runtime_sec`
# stops testing early, writes `state/checkpoint.json` (tested fingerprints + configs),
# and exits 0. Ephemeral state is restored on the next cron via:
#   1) cache restore (`v2agg-state-*`)
#   2) previous-run artifact download (best effort)
# Published outputs under `subs/` are committed for GitHub Pages. Checkpoint/healthy
# DB stay out of git (.gitignore).

on:
  schedule:
    # Hourly — servers die quickly; keep public lists fresh
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: false
        default: refresh
        type: choice
        options:
          - refresh
          - publish-only
      telegram_dry_run:
        description: "Dry-run Telegram (no API calls)"
        required: false
        default: false
        type: boolean

concurrency:
  group: v2agg-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Xray-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          bash scripts/install-xray.sh
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: v2agg-state-${{ github.run_id }}
          restore-keys: |
            v2agg-state-

      - name: Restore previous checkpoint artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: v2agg-checkpoint
          workflow: refresh.yml
          workflow_conclusion: completed
          path: state
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run aggregator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_DRY_RUN: ${{ github.event.inputs.telegram_dry_run == 'true' && 'true' || 'false' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'refresh' }}"
          EXTRA=()
          if [[ "${TELEGRAM_DRY_RUN}" == "true" ]]; then
            EXTRA+=(--telegram-dry-run)
          fi
          export PATH="${GITHUB_WORKSPACE}/bin:${PATH}"
          python -m v2agg --mode "${MODE}" --print-metrics "${EXTRA[@]}"

      - name: Upload checkpoint / state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2agg-checkpoint
          path: |
            state/checkpoint.json
            state/healthy.json
            state/metrics.json
            state/daily.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: v2agg-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit & push subscription files
        run: bash scripts/publish-subs.sh
